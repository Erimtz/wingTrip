spring:
  application:
    name: api-booking
  cloud:
    config:
      enabled: true
      uri: http://config-server:8888
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1

  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    jackson:
      serialization:
        FAIL_ON_EMPTY_BEANS: false
      deserialization:
        FAIL_ON_UNKNOWN_PROPERTIES: false

