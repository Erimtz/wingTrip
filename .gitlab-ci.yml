# GitLab CI/CD Pipeline para WingTrip
variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

stages:
  - build
  - test
  - quality-check
  - package

cache:
  paths:
    - .m2/repository/
    - target/
    - "*/target/"

# Paso 1: Compilar
build-services:
  stage: build
  image: maven:3.8.4-openjdk-17
  script:
    - echo "Compilando microservicios..."
    - mvn $MAVEN_CLI_OPTS -f config-server/pom.xml clean compile
    - mvn $MAVEN_CLI_OPTS -f eureka-server/pom.xml clean compile
    - mvn $MAVEN_CLI_OPTS -f api-gateway/pom.xml clean compile
    - mvn $MAVEN_CLI_OPTS -f api-user/pom.xml clean compile
    - mvn $MAVEN_CLI_OPTS -f api-booking/pom.xml clean compile
  artifacts:
    paths:
      - "*/target/"
    expire_in: 1 hour

# Paso 2: Tests con cobertura
test-with-coverage:
  stage: test
  image: maven:3.8.4-openjdk-17
  script:
    - echo "Ejecutando tests..."
    - mvn $MAVEN_CLI_OPTS -f api-user/pom.xml test jacoco:report
    - mvn $MAVEN_CLI_OPTS -f api-booking/pom.xml test
    - mvn $MAVEN_CLI_OPTS -f config-server/pom.xml test || echo "Tests opcionales"
    - mvn $MAVEN_CLI_OPTS -f api-gateway/pom.xml test || echo "Tests opcionales"
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
      coverage_report:
        coverage_format: jacoco
        path: "api-user/target/site/jacoco/jacoco.xml"
    paths:
      - "*/target/site/jacoco/"
      - "*/target/surefire-reports/"
    expire_in: 1 week

# Paso 3: Análisis de calidad
quality-check:
  stage: quality-check
  image: maven:3.8.4-openjdk-17
  script:
    - echo "Analizando calidad de código..."
    - ls -la api-user/target/site/jacoco/ || echo "No hay reportes de coverage"
  artifacts:
    paths:
      - "*/target/site/"
    expire_in: 1 week

# Paso 4: Empaquetar JARs
package-services:
  stage: package
  image: maven:3.8.4-openjdk-17
  script:
    - echo "Creando JARs..."
    - mvn $MAVEN_CLI_OPTS -f api-user/pom.xml package -DskipTests
    - mvn $MAVEN_CLI_OPTS -f api-booking/pom.xml package -DskipTests
    - echo "JARs creados:"
    - find . -name "*.jar" -type f | grep -v ".m2"
  artifacts:
    paths:
      - "*/target/*.jar"
    expire_in: 1 week
  only:
    - main
    - master