# GitLab CI/CD Pipeline para WingTrip
variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DskipTests"

stages:
  - build
  - test
  - quality-check
  - package

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/
    - target/
    - "*/target/"

# Paso 1: Compilar
build-services:
  stage: build
  image: maven:3.8.4-openjdk-17
  before_script:
    - echo "Iniciando compilación de microservicios..."
    - echo "Commit: $CI_COMMIT_SHA"
    - echo "Branch: $CI_COMMIT_REF_NAME"
  script:
    - echo "=== Compilando Config Server ==="
    - if [ -f "config-server/pom.xml" ]; then
      mvn $MAVEN_CLI_OPTS -f config-server/pom.xml clean compile;
      else
      echo "Config Server no encontrado, saltando...";
      fi
    - echo "=== Compilando Eureka Server ==="
    - if [ -f "eureka-server/pom.xml" ]; then
      mvn $MAVEN_CLI_OPTS -f eureka-server/pom.xml clean compile;
      else
      echo "Eureka Server no encontrado, saltando...";
      fi
    - echo "=== Compilando API Gateway ==="
    - if [ -f "api-gateway/pom.xml" ]; then
      mvn $MAVEN_CLI_OPTS -f api-gateway/pom.xml clean compile;
      else
      echo "API Gateway no encontrado, saltando...";
      fi
    - echo "=== Compilando API User ==="
    - if [ -f "api-user/pom.xml" ]; then
      mvn $MAVEN_CLI_OPTS -f api-user/pom.xml clean compile;
      else
      echo "API User no encontrado, saltando...";
      fi
    - echo "=== Compilando API Booking ==="
    - if [ -f "api-booking/pom.xml" ]; then
      mvn $MAVEN_CLI_OPTS -f api-booking/pom.xml clean compile;
      else
      echo "API Booking no encontrado, saltando...";
      fi
    - echo "=== Compilación completada ==="
  artifacts:
    paths:
      - "*/target/"
    expire_in: 2 hours
  allow_failure: false

# Paso 2: Tests solo para servicios con tests implementados
test-with-coverage:
  stage: test
  image: maven:3.8.4-openjdk-17
  dependencies:
    - build-services
  script:
    - echo "=== Ejecutando Tests ==="
    - echo "Ejecutando tests para API User (servicio principal con JaCoCo)..."
    - if [ -f "api-user/pom.xml" ]; then
        mvn $MAVEN_CLI_OPTS -f api-user/pom.xml test jacoco:report || echo "Tests de API User fallaron";
      else
        echo "API User no encontrado";
      fi
    - echo "Ejecutando tests básicos para API Booking (sin JaCoCo)..."
    - if [ -f "api-booking/pom.xml" ]; then
        mvn $MAVEN_CLI_OPTS -f api-booking/pom.xml test || echo "Tests de API Booking fallaron o no existen";
      else
        echo "API Booking no encontrado";
      fi
    - echo "Tests opcionales para servicios de infraestructura (sin JaCoCo)..."
    - if [ -f "config-server/pom.xml" ]; then
        mvn $MAVEN_CLI_OPTS -f config-server/pom.xml test || echo "Tests de Config Server opcionales";
      else
        echo "Config Server no encontrado";
      fi
    - if [ -f "eureka-server/pom.xml" ]; then
        mvn $MAVEN_CLI_OPTS -f eureka-server/pom.xml test || echo "Tests de Eureka opcionales";
      else
        echo "Eureka Server no encontrado";
      fi
    - if [ -f "api-gateway/pom.xml" ]; then
        mvn $MAVEN_CLI_OPTS -f api-gateway/pom.xml test || echo "Tests de Gateway opcionales";
      else
        echo "API Gateway no encontrado";
      fi
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
      coverage_report:
        coverage_format: jacoco
        path: "api-user/target/site/jacoco/jacoco.xml"
    paths:
      - "api-user/target/site/jacoco/"
      - "*/target/surefire-reports/"
    expire_in: 1 week
  allow_failure: true

# Paso 3: Análisis de calidad básico
quality-check:
  stage: quality-check
  image: maven:3.8.4-openjdk-17
  dependencies:
    - test-services
  script:
    - echo "=== Análisis de Calidad ==="
    - echo "Verificando reportes de cobertura..."
    - find . -name "jacoco.xml" -type f || echo "No se encontraron reportes de Jacoco"
    - echo "Verificando estructura del proyecto..."
    - ls -la */src/main/java/ || echo "Algunos servicios no tienen código Java"
    - echo "=== Métricas básicas ==="
    - echo "Líneas de código Java:"
    - find . -name "*.java" -type f -exec wc -l {} + | tail -1 || echo "No se pudieron contar líneas"
    - echo "Análisis completado"
  artifacts:
    paths:
      - "*/target/site/"
    expire_in: 1 week
  allow_failure: true

# Paso 4: Empaquetar JARs (solo servicios completamente funcionales)
package-services:
  stage: package
  image: maven:3.8.4-openjdk-17
  dependencies:
    - build-services
  script:
    - echo "=== Empaquetando Servicios ==="
    - echo "Empaquetando API User (servicio principal)..."
    - if [ -f "api-user/pom.xml" ]; then
        mvn $MAVEN_CLI_OPTS -f api-user/pom.xml package -DskipTests;
      fi
    - echo "Empaquetando servicios de infraestructura..."
    - if [ -f "config-server/pom.xml" ]; then
        mvn $MAVEN_CLI_OPTS -f config-server/pom.xml package -DskipTests || echo "Config Server falló";
      fi
    - if [ -f "eureka-server/pom.xml" ]; then
        mvn $MAVEN_CLI_OPTS -f eureka-server/pom.xml package -DskipTests || echo "Eureka Server falló";
      fi
    - if [ -f "api-gateway/pom.xml" ]; then
        mvn $MAVEN_CLI_OPTS -f api-gateway/pom.xml package -DskipTests || echo "API Gateway falló";
      fi
    - echo "Empaquetando API Booking (si está listo)..."
    - if [ -f "api-booking/pom.xml" ]; then
        mvn $MAVEN_CLI_OPTS -f api-booking/pom.xml package -DskipTests || echo "API Booking no está listo para empaquetar";
      fi
    - echo "=== JARs creados ==="
    - find . -name "*.jar" -type f | grep -v ".m2" | grep -v "original" || echo "No se crearon JARs"
  artifacts:
    paths:
      - "*/target/*.jar"
    expire_in: 1 week
  only:
    - main
    - master
    - /^feature\/.*$/ # Cualquier branch que empiece con "feature/"
  allow_failure: false