server:
  port: ${PORT:8761}

spring:
  application:
  name: eureka-server

eureka:
  instance:
    hostname: eureka-server
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enableSelfPreservation: true
    waitTimeInMsWhenSyncEmpty: 3000
    evictionIntervalTimerInMs: 15000